<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Moul&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <title>បញ្ជីសៀវភៅ</title>
    <style>
        :root {
            --bg-1: #eef3ff;
            --bg-2: #fef9ee;
            --bg-3: #ffeef2;
            --paper: #ffffff;
            --ink: #1c274c;
            --ink-soft: #343947;
            --ink-faint: #9aa3bf;

            --primary: #4361ee;
            --primary-dark: #2f46c7;
            --primary-light: #e9edff;
            --primary-glow: rgba(67, 97, 238, 0.28);

            --accent-purple: #8b5cf6;
            --accent-purple-dark: #6d28d9;
            --accent-coral: #ff6b6b;
            --accent-coral-dark: #e64545;
            --accent-emerald: #10b981;
            --accent-emerald-dark: #0a8f68;

            --hl-green-bg: #e3fbf0; --hl-green-text: #0ba360; --hl-green-border: #5be2a4;
            --hl-blue-bg: #eaf2ff; --hl-blue-text: #2e6ee0; --hl-blue-border: #8fb8ff;
            --hl-amber-bg: #fff6e0; --hl-amber-text: #b7791f; --hl-amber-border: #ffd166;
            --hl-red-bg: #ffeef0; --hl-red-text: #e0405c; --hl-red-border: #ffb2c0;
            --hl-gray-bg: #f4f5f9; --hl-gray-text: #9aa3bf; --hl-gray-border: #e2e5f0;
            --placeholder-text: #564131bf;

            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-pill: 999px;

            --shadow-sm: 0 2px 8px rgba(28, 39, 76, 0.07);
            --shadow-md: 0 10px 26px rgba(28, 39, 76, 0.10);
            --shadow-lg: 0 22px 48px rgba(28, 39, 76, 0.18);

            --student-column-width: 150px;
            --subject-column-width: 105px;
            --subject-column-gap: 12px;
        }

        * {
            box-sizing: border-box;
            font-family: 'Poppins', 'Battambang', system-ui, Tahoma, Geneva, Verdana, sans-serif;
        }

        html { scroll-behavior: smooth; }

        body {
            position: relative;
            background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 50%, var(--bg-3) 100%);
            background-size: 300% 300%;
            animation: gradientDrift 20s ease infinite;
            margin: 0;
            padding: 0;
            padding-bottom: 64px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: var(--ink);
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            left: 50%;
            top: 50%;
            width: 30vw;
            height: 30vw;
            max-width: 420px;
            max-height: 420px;
            min-width: 220px;
            min-height: 220px;
            transform: translate(-50%, -50%);
            background-image: url("https://i.pinimg.com/originals/4b/cb/1f/4bcb1fb72d1d08efa44efa5ceb712ec7.gif");
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            border-radius: 24px;
            border: 0px solid rgba(255,255,255,0.9);
            box-shadow: 0 0px 0px rgba(28, 39, 76, 0.12);
            opacity: 0.7;
            pointer-events: none;
            z-index: 0;
            animation: photoFloat 8s ease-in-out infinite;
        }

        @keyframes photoFloat {
            0%, 100% { transform: translate(-50%, -50%) translateY(0px); }
            50% { transform: translate(-50%, -50%) translateY(-14px); }
        }

        @keyframes gradientDrift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        ::selection { background: var(--primary-light); color: var(--primary-dark); }

        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, var(--primary), var(--accent-purple)); border-radius: var(--radius-pill); }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary-dark); }

        /* --- PAGE LOADER STYLES --- */
        .loader-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, var(--bg-1), var(--bg-3));
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.45s ease;
        }

        .loader-badge {
            width: 84px; height: 84px;
            border-radius: 28px;
            display: flex; align-items: center; justify-content: center;
            background: var(--paper);
            box-shadow: var(--shadow-lg);
            margin-bottom: 22px;
            animation: loaderBob 1.8s ease-in-out infinite;
        }

        .loader-badge i {
            font-size: 2rem;
            background: linear-gradient(135deg, var(--primary), var(--accent-purple));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        @keyframes loaderBob {
            0%, 100% { transform: translateY(0) rotate(-3deg); }
            50% { transform: translateY(-10px) rotate(3deg); }
        }

        .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid var(--primary-light);
            border-top: 4px solid var(--primary);
            border-right: 4px solid var(--accent-purple);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        .loader-text {
            margin-top: 18px;
            font-family: "Battambang", sans-serif;
            color: var(--ink);
            font-size: 1.05rem;
            font-weight: bold;
            animation: pulse 1.5s infinite ease-in-out;
            letter-spacing: 0.3px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0% { opacity: 0.55; }
            50% { opacity: 1; }
            100% { opacity: 0.55; }
        }
        /* ------------------------- */

        .hero {
            position: relative;
            z-index: 1;
            overflow: hidden;
            background: linear-gradient(120deg, #4361ee 0%, #6c5ce7 55%, #8b5cf6 100%);
            color: white;
            width: 100%;
            padding: 2.1rem 1rem 3.1rem;
            text-align: center;
            border-radius: 0 0 32px 32px;
            box-shadow: 0 14px 34px rgba(67, 97, 238, 0.28);
            animation: heroFadeIn 0.7s ease both;
        }

        @keyframes heroFadeIn {
            from { opacity: 0; transform: translateY(-14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hero-decor {
            position: fixed;
            opacity: 0.16;
            font-size: 1.7rem;
            color: white;
            animation: floatIcon 6s ease-in-out infinite;
            z-index: 0;
        }

        @keyframes floatIcon {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-14px) rotate(10deg); }
        }

        .hero h3 {
            margin: 0 0 6px;
            font-size: 1.6rem;
            font-family: "Moul";
            position: relative;
            z-index: 1;
            text-shadow: 0 2px 14px rgba(0,0,0,0.18);
        }

        .hero p {
            font-family: "Battambang";
            font-size: 1.15rem;
            margin: 0;
            position: relative;
            z-index: 1;
            opacity: 0.95;
        }

        .search-container {
            position: relative;
            z-index: 1;
            max-width: 600px;
            margin: -28px auto 0 auto;
            width: 90%;
            z-index: 5;
            animation: floatUp 0.6s ease 0.1s both;
        }

        @keyframes floatUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #searchInput {
            width: 100%;
            padding: 16px 25px 16px 52px;
            font-size: 1.05rem;
            border: none;
            border-radius: var(--radius-pill);
            outline: none;
            background: var(--paper);
            box-shadow: var(--shadow-lg);
            transition: box-shadow 0.3s ease, transform 0.2s ease;
            color: var(--ink);
        }

        #searchInput::placeholder { color: var(--ink-faint); }

        #searchInput:focus {
            box-shadow: 0 14px 32px var(--primary-glow), 0 0 0 4px var(--primary-light);
            transform: translateY(-2px);
        }

        .search-icon {
            position: absolute;
            left: 22px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--ink-faint);
            font-size: 1.05rem;
            pointer-events: none;
            transition: color 0.3s ease, transform 0.3s ease;
        }

        #searchInput:focus ~ .search-icon {
            color: var(--primary);
            transform: translateY(-50%) scale(1.15) rotate(-8deg);
        }

        #resultsContainer {
            position: relative;
            z-index: 1;
            width: 90%;
            max-width: 600px;
            margin: 14px auto 0;
            background: var(--paper);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            display: none;
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid rgba(67, 97, 238, 0.08);
        }

        .class-item {
            padding: 15px 25px;
            border-bottom: 1px solid #f0f2fa;
            color: var(--ink);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: background 0.2s ease, color 0.2s ease, padding-left 0.2s ease;
            animation: itemFadeIn 0.3s ease both;
        }

        @keyframes itemFadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .class-item:nth-child(1) { animation-delay: 0.02s; }
        .class-item:nth-child(2) { animation-delay: 0.05s; }
        .class-item:nth-child(3) { animation-delay: 0.08s; }
        .class-item:nth-child(4) { animation-delay: 0.11s; }
        .class-item:nth-child(5) { animation-delay: 0.14s; }
        .class-item:nth-child(6) { animation-delay: 0.17s; }
        .class-item:nth-child(7) { animation-delay: 0.20s; }
        .class-item:nth-child(8) { animation-delay: 0.23s; }

        .class-item::before {
            content: "";
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 4px;
            background: linear-gradient(180deg, var(--primary), var(--accent-purple));
            transform: scaleY(0);
            transition: transform 0.2s ease;
        }

        .class-item:last-child { border-bottom: none; }

        .class-item:hover {
            background-color: var(--primary-light);
            color: var(--primary-dark);
            padding-left: 30px;
        }

        .class-item:hover::before { transform: scaleY(1); }

        .no-results {
            padding: 22px;
            text-align: center;
            color: var(--ink-faint);
            font-style: italic;
        }

        /* --- WIDE STUDENT PANEL STYLES --- */
        .panel-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(28, 39, 76, 0.55);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .student-panel {
            background: rgba(250, 251, 255, 0.98);
            width: 98%;
            max-width: 96%;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            max-height: 95vh;
            animation: panelSlideIn 0.35s cubic-bezier(.16,1,.3,1) both;
            font-family: 'Battambang';
        }

        @keyframes panelSlideIn {
            from { transform: translateY(28px) scale(0.97); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }

        .panel-header {
            background: linear-gradient(120deg, var(--primary), var(--accent-purple));
            color: white;
            padding: 16px 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-header h2 {
            margin: 0;
            font-size: 1.22rem;
            letter-spacing: 0.2px;
        }

        .close-btn {
            background: rgba(255,255,255,0.2);
            font-size: 1.4rem;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 50%;
            color: #ffffff;
            transition: all 0.25s ease;
        }
        .close-btn:hover {
            color: var(--accent-coral-dark);
            background-color: #ffffff;
            transform: rotate(90deg);
        }

        .panel-content {
            padding: 8px;
            overflow-x: auto;
            overflow-y: auto;
            flex-grow: 1;
            background: linear-gradient(180deg, #fbfcff, #f5f7ff);
        }

        .student-item {
            display: flex;
            align-items: center;
            border-bottom: 1px solid #eef0fa;
            padding: 6px 4px;
            min-width: max-content;
            border-radius: 12px;
            transition: background 0.2s ease, transform 0.15s ease;
            animation: rowFadeIn 0.35s ease both;
        }

        @keyframes rowFadeIn {
            from { opacity: 0; transform: translateX(-8px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .student-item:nth-child(1) { animation-delay: 0.01s; }
        .student-item:nth-child(2) { animation-delay: 0.03s; }
        .student-item:nth-child(3) { animation-delay: 0.05s; }
        .student-item:nth-child(4) { animation-delay: 0.07s; }
        .student-item:nth-child(5) { animation-delay: 0.09s; }
        .student-item:nth-child(6) { animation-delay: 0.11s; }
        .student-item:nth-child(7) { animation-delay: 0.13s; }
        .student-item:nth-child(8) { animation-delay: 0.15s; }
        .student-item:nth-child(9) { animation-delay: 0.17s; }
        .student-item:nth-child(10) { animation-delay: 0.19s; }

        .student-item:hover {
            background-color: var(--primary-light);
            transform: translateX(2px);
        }

        /* Sticky Last Row (summary row) at bottom of scroll area */
        .student-item.sticky-bottom {
            position: sticky;
            bottom: 0;
            z-index: 3;
            background: linear-gradient(180deg, #fff7f2, #ffe9e9);
            box-shadow: 0 -6px 16px -4px rgba(28,39,76,0.10);
            border-radius: 12px;
        }

        .student-item.sticky-bottom .student-info {
            background: transparent;
        }

        /* Sticky Student Column */
        .student-info {
            height: 65px;
            display: flex;
            align-items: center;
            width: var(--student-column-width);
            flex: 0 0 var(--student-column-width);
            flex-shrink: 0;
            position: sticky;
            left: 0;
            background: var(--paper);
            z-index: 2;
            padding-right: 1px;
            box-shadow: 4px 0 10px -4px rgba(28,39,76,0.08);
            font-size: 0.9rem;
            border-radius: 12px;
        }
        .student-info:hover {
            width: var(--student-column-width);
        }

        .student-item:hover .student-info {
            background-color: var(--primary-light);
        }

        .student-avatar {
            width: 30px; height: 30px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-light), #dbe3ff);
            color: var(--primary);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            margin-right: 6px;
            font-size: 0.85rem;
        }

        .student-name {
            font-weight: 600;
            color: var(--ink);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
        }

        .student-name.is-expanded {
            position: absolute;
            left: 42px;
            top: 50%;
            z-index: 10;
            width: max-content;
            max-width: calc(100vw - 76px);
            padding: 7px 10px;
            white-space: normal;
            overflow: visible;
            text-overflow: clip;
            word-break: keep-all;
            background: var(--paper);
            border: 1px solid var(--primary-light);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-md);
            transform: translateY(-50%);
        }

        /* Subjects Container */
        .subjects-container {
            display: flex;
            gap: var(--subject-column-gap);
            padding-left: 10px;
        }

        .subject-attendance {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            width: var(--subject-column-width);
            min-width: var(--subject-column-width);
            flex: 0 0 var(--subject-column-width);
            background: var(--paper);
            border-radius: 14px;
            padding: 8px 6px;
            box-shadow: var(--shadow-sm);
            transition: box-shadow 0.2s ease, transform 0.2s ease;
        }

        .subject-attendance:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .subject-label {
            font-size: 0.8rem;
            color: var(--ink-soft);
            font-weight: 720;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        /* Subject Header Row (sticky, columns match .subject-attendance width so it lines up with every student row) */
        .subject-header-row {
            display: flex;
            align-items: stretch;
            position: sticky;
            top: 0;
            z-index: 4;
            background: linear-gradient(180deg, #fbfcff, #f5f7ff);
            border-bottom: 2px solid var(--primary-light);
            padding: 6px 4px;
            min-width: max-content;
           
        }

        .subject-header-spacer {
            width: var(--student-column-width);
            flex: 0 0 var(--student-column-width);
            position: sticky;
            left: 0;
            background: var(--paper);
            z-index: 5;
            border-radius: 12px;
            box-shadow: 4px 0 10px -4px rgba(28,39,76,0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-family: 'Battambang', sans-serif;
            font-size: 0.84rem;
            font-weight: 720;
            color: var(--primary-dark);
        }

        .subject-header-cells {
            display: flex;
            gap: var(--subject-column-gap);
            padding-left: 10px;
        }

        .subject-header-cell {
            width: var(--subject-column-width);
            min-width: var(--subject-column-width);
            flex: 0 0 var(--subject-column-width);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 0.88rem;
            font-weight: 720;
            color: var(--primary-dark);
            text-transform: uppercase;
            letter-spacing: 0.3px;
            white-space: nowrap;
            padding: 8px 6px;
        }

        /* Header cell that also holds the ភាសា (English/French/Chinese) picker,
           shown as a small round icon button sitting to the right of the
           subject label, so the column width/alignment with student rows
           below stays unchanged. */
        .subject-header-cell-with-select {
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 4px;
            white-space: normal;
            padding: 8px 3px;
        }

        .subject-header-label {
            width: auto;
            font-size: 0.74rem;
            line-height: 1.15;
        }

        .subject-header-lang-select {
            flex: 0 0 22px;
            width: 22px;
            height: 22px;
            min-height: 22px;
            min-width: 22px;
            padding: 0;
            border-radius: 50%;
            background-color: var(--primary-light);
            background-image: none;
            color: var(--primary-dark);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
        }

        .subject-header-lang-select:hover:not(:disabled) {
            background-color: var(--primary);
            color: #fff;
        }

        .attendance-select, .attendance-input {
            padding: 8px 10px;
            border-radius: var(--radius-pill);
            border: 1.5px solid var(--hl-gray-border);
            outline: none;
            font-weight: 700;
            font-size: 0.82rem;
            width: 100%;
            min-height: 38px;
            line-height: 1.3;
            text-align: center;
            text-align-last: center;
            transition: all 0.2s ease;
            background-color: var(--hl-gray-bg);
            color: var(--hl-gray-text);
            -webkit-tap-highlight-color: transparent;
            box-shadow: var(--shadow-sm);
        }

        /* Reset native OS/browser chrome so the select looks identical
           across Chrome, Safari, Firefox, and mobile browsers, then draw
           our own dropdown arrow so it stays consistent everywhere. */
        .attendance-select {
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            padding-right: 30px;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236b7593' stroke-width='2.75' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'%3E%3C/polyline%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right 10px center;
            background-size: 13px;
        }

        .attendance-select::-ms-expand { display: none; }

        .attendance-select:hover:not(:disabled) {
            border-color: var(--primary);
            box-shadow: var(--shadow-md);
        }

        .attendance-select:focus, .attendance-input:focus {
            box-shadow: 0 0 0 4px var(--primary-light);
            border-color: var(--primary);
        }

        .attendance-input {
            background-color: #ffffff;
            color: #333;
            max-width: 120px;
            cursor: text;
        }

        .attendance-select:disabled {
            background-color: #f4f5f9;
            color: #c3c8db;
            cursor: not-allowed;
            border-color: #eceef6;
            opacity: 0.7;
            box-shadow: none;

        // Renders every page of the PDF as an image inside the modal.
        // Using PDF.js instead of an <iframe>/blob URL is what makes this work
        // reliably on mobile browsers and in-app browsers (Telegram, Messenger, etc.)
        async function openPdfPreview(pdfBytes, title) {
            pdfPreviewTitle.textContent = title || 'មើលឯកសារ PDF';
            pdfPreviewPages.innerHTML = '';
            pdfPreviewPages.style.visibility = 'hidden';
            pdfPreviewZoom = 1;
            updatePdfPreviewZoom();
            pdfPreviewLoading.style.display = 'flex';
            pdfPreviewOverlay.style.display = 'flex';

            try {
                if (!window.pdfjsLib) {
                    throw new Error('PDF.js not loaded');
                }

                const loadingTask = pdfjsLib.getDocument({ data: pdfBytes });
                const pdfDoc = await loadingTask.promise;

                for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
                    const page = await pdfDoc.getPage(pageNum);
                    const containerWidth = pdfPreviewPages.clientWidth || 800;
                    const baseViewport = page.getViewport({ scale: 1 });
                    const scale = (containerWidth / baseViewport.width) * (window.devicePixelRatio || 1);
                    const viewport = page.getViewport({ scale });

                    const canvas = document.createElement('canvas');
                    canvas.className = 'pdf-page-canvas';
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;
                    canvas.dataset.baseWidth = viewport.width / (window.devicePixelRatio || 1);
                    canvas.style.width = canvas.dataset.baseWidth + 'px';

                    const context = canvas.getContext('2d');
                    await page.render({ canvasContext: context, viewport: viewport }).promise;

                    pdfPreviewPages.appendChild(canvas);

                    if (pageNum === 1) {
                        pdfPreviewLoading.style.display = 'none';
                        pdfPreviewPages.style.visibility = 'visible';
                    }
                }
            } catch (err) {
                console.error(err);
                pdfPreviewLoading.style.display = 'none';
                closePdfPreview();
                showPopup('មិនអាចបើកមើល PDF បានទេ សូមព្យាយាមទាញយកជំនួសវិញ (Could not preview the PDF — please try downloading it instead).');
            }
        }

        let isDraggingPdfPreview = false;

        function startPdfPreviewDrag(clientX, clientY, target) {
            if (target.closest('button, .pdf-preview-close, .pdf-page-canvas')) return;

            const boxRect = pdfPreviewBox.getBoundingClientRect();
            const isResizeHandle = clientX >= boxRect.right - 20 && clientY >= boxRect.bottom - 20;
            if (isResizeHandle) return;
            isDraggingPdfPreview = true;
            pdfPreviewDragPositioned = false;
            pdfPreviewDragStartX = clientX;
            pdfPreviewDragStartY = clientY;
            pdfPreviewDragOffsetX = clientX - boxRect.left;
            pdfPreviewDragOffsetY = clientY - boxRect.top;
        }

        pdfPreviewBox.addEventListener('mousedown', (event) => {
            startPdfPreviewDrag(event.clientX, event.clientY, event.target);
        });

        pdfPreviewBox.addEventListener('touchstart', (event) => {
            if (event.touches.length === 1) {
                const touch = event.touches[0];
                startPdfPreviewDrag(touch.clientX, touch.clientY, event.target);
            }
        }, { passive: true });

        document.addEventListener('mousemove', (event) => {
            if (!isDraggingPdfPreview) return;
            if (!pdfPreviewDragPositioned) {
                const movedDistance = Math.max(
                    Math.abs(event.clientX - pdfPreviewDragStartX),
                    Math.abs(event.clientY - pdfPreviewDragStartY)
                );
                if (movedDistance < 3) return;
                const boxRect = pdfPreviewBox.getBoundingClientRect();
                pdfPreviewBox.style.left = `${boxRect.left}px`;
                pdfPreviewBox.style.top = `${boxRect.top}px`;
                pdfPreviewBox.style.transform = 'none';
                pdfPreviewBox.classList.add('is-dragging');
                pdfPreviewDragPositioned = true;
            }
            const visibleEdge = 80;
            const maxLeft = Math.max(0, window.innerWidth - visibleEdge);
            const maxTop = Math.max(0, window.innerHeight - visibleEdge);
            const left = Math.min(maxLeft, Math.max(0, event.clientX - pdfPreviewDragOffsetX));
            const top = Math.min(maxTop, Math.max(0, event.clientY - pdfPreviewDragOffsetY));
            pdfPreviewBox.style.left = `${left}px`;
            pdfPreviewBox.style.top = `${top}px`;
        });

        document.addEventListener('mouseup', () => {
            isDraggingPdfPreview = false;
            pdfPreviewBox.classList.remove('is-dragging');
            pdfPreviewDragPositioned = false;
        });

        document.addEventListener('touchmove', (event) => {
            if (!isDraggingPdfPreview || event.touches.length !== 1) return;
            event.preventDefault();
            if (!pdfPreviewDragPositioned) {
                const touch = event.touches[0];
                const movedDistance = Math.max(
                    Math.abs(touch.clientX - pdfPreviewDragStartX),
                    Math.abs(touch.clientY - pdfPreviewDragStartY)
                );
                if (movedDistance < 3) return;

                pdfPreviewBox.style.left = `${boxRect.left}px`;

            const touch = event.touches[0];

            const maxTop = Math.max(0, window.innerHeight - visibleEdge);
            const left = Math.min(maxLeft, Math.max(0, touch.clientX - pdfPreviewDragOffsetX));
            const top = Math.min(maxTop, Math.max(0, touch.clientY - pdfPreviewDragOffsetY));
            pdfPreviewBox.style.left = `${left}px`;
            pdfPreviewBox.style.top = `${top}px`;
        }, { passive: false });

        document.addEventListener('touchend', () => {
            isDraggingPdfPreview = false;
            pdfPreviewBox.classList.remove('is-dragging');
            pdfPreviewDragPositioned = false;

function isInAppBrowser() {

    return (ua.includes("FBAN") || ua.includes("FBAV") ||

async function triggerDownload(action, type, sheetName, mode = 'download', className = sheetName) {
    showDownloadOverlay(type, mode);

    try {
        const orientation = getPdfOrientation(className);
        const scriptUrl = `${WEB_APP_URL}?action=${action}&sheetName=${encodeURIComponent(sheetName)}&className=${encodeURIComponent(className)}&orientation=${encodeURIComponent(orientation)}`;
        const response = await fetch(scriptUrl);
        const data = await response.json();

        if (!data.success || !data.base64) {
            throw new Error(data.error || 'Failed to generate file.');
        }

        // Convert Base64 response into local file bytes
        const byteCharacters = atob(data.base64);
        const byteNumbers = new Array(byteCharacters.length);
        for (let i = 0; i < byteCharacters.length; i++) {
            byteNumbers[i] = byteCharacters.charCodeAt(i);
        }
        const byteArray = new Uint8Array(byteNumbers);

        if (mode === 'preview') {
            // Render pages directly via PDF.js instead of a blob URL/iframe —
            // this is what makes preview work on mobile & in-app browsers.
            const previewTitle = `${document.title || 'Sheet'} - ${sheetName}`;
            await openPdfPreview(byteArray, previewTitle);
        } else {
            const blob = new Blob([byteArray], { type: data.mimeType });
            const blobUrl = URL.createObjectURL(blob);

            const extension = type === 'pdf' ? 'pdf' : 'xlsx';
            const classLabel = String(className || sheetName || 'Class').trim();
            const fileNameBase = `បញ្ជីសៀវភៅ ${classLabel || 'Class'}`
                .replace(/[\\/:*?"<>|]/g, '')
                .replace(/\s+/g, ' ')
                .trim();
            const downloadName = `${fileNameBase}.${extension}`;

            const downloadAnchor = document.createElement('a');
            downloadAnchor.href = blobUrl;
            downloadAnchor.download = downloadName;
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            document.body.removeChild(downloadAnchor);

            setTimeout(() => URL.revokeObjectURL(blobUrl), 2000);
        }

    } catch (err) {
        console.error(err);
        showPopup('Download failed. Please check your internet and try again!');
    } finally {
        setTimeout(hideDownloadOverlay, 1000);
    }
}
        // Convert Khmer numerals to Arabic numerals
        function khmerToArabic(str) {
            const khmerDigits = ['០', '១', '២', '៣', '៤', '៥', '៦', '៧', '៨', '៩'];
            let result = str;
            for (let i = 0; i < 10; i++) {
                result = result.replace(new RegExp(khmerDigits[i], 'g'), i);
            }
            return result;
        }

        // Builds the ភាសា (English/French/Chinese) picker that lives on the
        // ភាសា(ខ្ចី) header cell. One selection applies to every student in the
        // currently open class, saved to the sheet under the "ភាសា" column.
        function buildLanguageHeaderSelect() {
            const className = currentSelectedClass;
            if (!attendanceData[className]) attendanceData[className] = {};
            if (!attendanceData[className][LANGUAGE_SHEET_HEADER]) {
                attendanceData[className][LANGUAGE_SHEET_HEADER] = {};
            }

            const select = document.createElement('select');
            select.className = 'attendance-select subject-header-lang-select';

            languageOptions.forEach(lang => {
                const opt = document.createElement('option');
                opt.value = lang;
                opt.textContent = lang;
                select.appendChild(opt);
            });

            // Prefer an in-memory (unsaved) selection, then whatever was last
            // saved to the sheet for this class, defaulting to អង់គ្លេស.
            const localValues = Object.values(attendanceData[className][LANGUAGE_SHEET_HEADER]).filter(v => v);
            const initVal = localValues.length ? localValues[0] : (getSavedLanguageValue(className) || languageOptions[0]);
            select.value = initVal;
            updateSelectColor(select, select.value);

            // Only the first (non-summary) student in the class carries the
            // ភាសា value — it's a per-class setting, so one row is enough.
            const students = studentData[className] || [];
            const firstStudent = students.find(s => s.name !== "សរុបចំនួនខូច");

            // Make sure the default (or restored) value is actually queued for
            // save, not just displayed.
            if (firstStudent && attendanceData[className][LANGUAGE_SHEET_HEADER][firstStudent.id] === undefined) {
                attendanceData[className][LANGUAGE_SHEET_HEADER][firstStudent.id] = initVal;
            }

            select.addEventListener('change', (e) => {
                const val = e.target.value;
                if (firstStudent) {
                    attendanceData[className][LANGUAGE_SHEET_HEADER][firstStudent.id] = val;
                }
                updateSelectColor(select, val);
                scheduleAutoSave();
            });

            return enhanceSelect(select, { iconOnly: true, icon: 'fa-language' });
        }

                    }

                    if (!attendanceData[currentSelectedClass][subject]) {
                        attendanceData[currentSelectedClass][subject] = {};
                    }

                    const subjectBlock = document.createElement('div');
                    subjectBlock.className = 'subject-attendance';

                    // Load saved status from local user changes OR database
                    if (attendanceData[currentSelectedClass][subject][studentId] === undefined) {
                        const rawStatus = savedAttendanceObj[subject];
                        const dbStatus = (rawStatus === undefined || rawStatus === null || rawStatus === '') ? null : rawStatus;
                        attendanceData[currentSelectedClass][subject][studentId] = dbStatus;
                    }

                    const currentStatus = attendanceData[currentSelectedClass][subject][studentId];

                    // Render Text Input for "ផ្សេងៗ", Select Dropdown for others
                    if (subject === "ផ្សេងៗ") {
                        const input = document.createElement('input');
                        input.type = 'text';
                        input.className = 'attendance-input';
                        input.placeholder = '...';
                        input.value = currentStatus || '';

                        input.addEventListener('input', (e) => {
                            const val = e.target.value.trim();
                            attendanceData[currentSelectedClass][subject][studentId] = (val === '') ? null : val;
                            scheduleAutoSave();
                        });

                        subjectBlock.appendChild(input);
                    } else if (isDamagedSummaryRow && subject.includes('(សង)')) {
                        // Damaged-summary row: (សង) subjects become a number input instead of a select
                        const input = document.createElement('input');
                        input.type = 'text';
                        input.inputMode = 'numeric';
                        input.className = 'attendance-input';
                        input.placeholder = 'ចំនួនខូច';
                        input.value = (currentStatus === null || currentStatus === undefined || currentStatus === '') ? '' : currentStatus;

                        input.addEventListener('input', (e) => {
                            const khmerDigits = '០១២៣៤៥៦៧៨៩';
                            const val = e.target.value
                                .replace(/[០-៩]/g, digit => String(khmerDigits.indexOf(digit)))
                                .replace(/[^0-9]/g, '');
                            e.target.value = val;
                            attendanceData[currentSelectedClass][subject][studentId] = (val === '') ? null : val;
                            scheduleAutoSave();
                        });

                        subjectBlock.appendChild(input);
                    } else {
                        const select = document.createElement('select');
                        select.className = 'attendance-select';

                        const optNoSelect = document.createElement('option');
                        optNoSelect.value = 'null';
                        optNoSelect.textContent = 'ជ្រើសរើស';
                        select.appendChild(optNoSelect);

                        // Base subject name shared between the (ខ្ចី) and (សង) pair, e.g. "ខ្មែរ"
                        const baseSubject = subject.replace('(ខ្ចី)', '').replace('(សង)', '');
                        if (!pairSelects[baseSubject]) pairSelects[baseSubject] = {};

                        // Dynamic options based on subject type
                        if (subject.includes('(សង)')) {
                            const optBat = document.createElement('option');
                            optBat.value = '1';
                            optBat.textContent = 'សង';

                            const optSong = document.createElement('option');
                            optSong.value = '0';
                            optSong.textContent = 'បាត់';

                            select.appendChild(optBat);
                            select.appendChild(optSong);
                        } else {
                            const optThmei = document.createElement('option');
                            optThmei.value = 'ថ្មី';
                            optThmei.textContent = 'ថ្មី';

                            const optChas = document.createElement('option');
                            optChas.value = 'ចាស់';
                            optChas.textContent = 'ចាស់';

                            select.appendChild(optThmei);
                            select.appendChild(optChas);
                        }

                        const selectStatus = (currentStatus === null || currentStatus === undefined || currentStatus === '') ? 'null' : String(currentStatus);
                        select.value = selectStatus;
                        updateSelectColor(select, selectStatus);

                        // Remember this (ខ្ចី) select so its paired (សង) select can check it
                        if (subject.includes('(ខ្ចី)')) {
                            pairSelects[baseSubject].khciSelect = select;
                        }

                        // A (សង) select starts disabled unless its (ខ្ចី) pair is already ថ្មី/ចាស់
                        if (subject.includes('(សង)')) {
                            pairSelects[baseSubject].songSelect = select;
                            const khciSelect = pairSelects[baseSubject].khciSelect;
                            const khciVal = khciSelect ? khciSelect.value : 'null';
                            select.disabled = !(khciVal === 'ថ្មី' || khciVal === 'ចាស់');
                        }

                        select.addEventListener('change', (e) => {
                            const val = e.target.value;
                            attendanceData[currentSelectedClass][subject][studentId] = (val === 'null') ? null : val;
                            updateSelectColor(select, val);
                            scheduleAutoSave();

                            // When (ខ្ចី) changes, enable/disable its paired (សង) select accordingly
                            if (subject.includes('(ខ្ចី)')) {
                                const pair = pairSelects[baseSubject];
                                const songSelect = pair ? pair.songSelect : null;
                                if (songSelect) {
                                    const shouldEnable = (val === 'ថ្មី' || val === 'ចាស់');
                                    songSelect.disabled = !shouldEnable;
                                    if (!shouldEnable) {
                                        // Reset the (សង) status when its (ខ្ចី) pair is cleared
                                        const songSubject = baseSubject + '(សង)';
                                        songSelect.value = 'null';
                                        if (attendanceData[currentSelectedClass][songSubject]) {
                                            attendanceData[currentSelectedClass][songSubject][studentId] = null;
                                        }
                                        updateSelectColor(songSelect, 'null');
                                    }
                                }
                            }
                        });

                        subjectBlock.appendChild(enhanceSelect(select));
                    }

                    subjectsContainer.appendChild(subjectBlock);
                });

                studentDiv.appendChild(subjectsContainer);
                studentListContainer.appendChild(studentDiv);
            });
        }

        // --- Custom dropdown engine -------------------------------------
        // Native <select> option lists render with completely different
        // fonts/colors/paddings on Chrome, Safari, Firefox and mobile OS
        // pickers, and CSS can't touch <option> styling to fix that. So
        // we keep the real <select> (for its value/disabled/change-event
        // behavior, which the rest of the app already relies on) but hide
        // it and drive a custom-built, fully-styled dropdown on top of it
        // that looks identical everywhere.
        let __csGlobalListenersReady = false;
        function ensureCustomSelectGlobalListeners() {
            if (__csGlobalListenersReady) return;
            __csGlobalListenersReady = true;
            document.addEventListener('click', (e) => {
                document.querySelectorAll('.custom-select-wrap.open').forEach(w => {
                    if (!w.contains(e.target)) w._csClose();
                });
            });
            document.addEventListener('scroll', () => {
                document.querySelectorAll('.custom-select-wrap.open').forEach(w => w._csClose());
            }, true);
            window.addEventListener('resize', () => {
                document.querySelectorAll('.custom-select-wrap.open').forEach(w => w._csClose());
            });
        }

        function enhanceSelect(select, options = {}) {
            ensureCustomSelectGlobalListeners();
            const iconOnly = !!options.iconOnly;
            const iconClass = options.icon || 'fa-language';

            const wrap = document.createElement('div');
            wrap.className = 'custom-select-wrap';

            const trigger = document.createElement('button');
            trigger.type = 'button';
            trigger.className = select.className;
            trigger.setAttribute('aria-haspopup', 'listbox');
            trigger.setAttribute('aria-expanded', 'false');

            const panel = document.createElement('div');
            panel.className = 'cs-panel';
            panel.setAttribute('role', 'listbox');
            document.body.appendChild(panel);

            function labelFor(value) {
                const opt = Array.from(select.options).find(o => o.value === value);
                return opt ? opt.textContent : '';
            }

            function syncTrigger() {
                if (iconOnly) {
                    trigger.innerHTML = `<i class="fa-solid ${iconClass}"></i>`;
                    trigger.title = labelFor(select.value) || 'ជ្រើសរើស';
                } else {
                    trigger.textContent = labelFor(select.value);
                }
                trigger.className = select.className; // mirrors status colors (attendant/absent/etc.)
                trigger.disabled = select.disabled;
                panel.querySelectorAll('.cs-option').forEach(item => {
                    item.classList.toggle('selected', item.dataset.value === select.value);
                });
            }

            function buildOptions() {
                panel.innerHTML = '';
                Array.from(select.options).forEach(opt => {
                    const item = document.createElement('div');
                    item.className = 'cs-option';
                    item.setAttribute('role', 'option');
                    item.dataset.value = opt.value;
                    item.textContent = opt.textContent;
                    if (opt.value === select.value) item.classList.add('selected');
                    item.addEventListener('click', () => {
                        if (select.value !== opt.value) {
                            select.value = opt.value;
                            select.dispatchEvent(new Event('change'));
                        }
                        syncTrigger();
                        closeDropdown();
                    });
                    panel.appendChild(item);
                });
            }

            function positionPanel() {
                const r = trigger.getBoundingClientRect();
                const panelWidth = iconOnly ? Math.max(130, r.width) : r.width;
                const spaceBelow = window.innerHeight - r.bottom;
                const flipUp = spaceBelow < 220 && r.top > spaceBelow;
                let left = Math.round(r.left);
                const maxLeft = window.innerWidth - panelWidth - 8;
                if (left > maxLeft) left = Math.max(8, maxLeft);
                panel.style.left = left + 'px';
                panel.style.width = Math.round(panelWidth) + 'px';
                panel.classList.toggle('flip-up', flipUp);
                if (flipUp) {
                    panel.style.top = 'auto';
                    panel.style.bottom = (window.innerHeight - r.top + 6) + 'px';
                } else {
                    panel.style.bottom = 'auto';
                    panel.style.top = (r.bottom + 6) + 'px';
                }
            }

            function openDropdown() {
                if (select.disabled) return;
                document.querySelectorAll('.custom-select-wrap.open').forEach(w => { if (w !== wrap) w._csClose(); });
                buildOptions();
                positionPanel();
                wrap.classList.add('open');
                panel.classList.add('open');
                trigger.setAttribute('aria-expanded', 'true');
            }

            function closeDropdown() {
                wrap.classList.remove('open');
                panel.classList.remove('open');
                trigger.setAttribute('aria-expanded', 'false');
            }
            wrap._csClose = closeDropdown;

            trigger.addEventListener('click', (e) => {
                e.stopPropagation();
                if (wrap.classList.contains('open')) closeDropdown(); else openDropdown();
            });

            trigger.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeDropdown();
                if ((e.key === 'ArrowDown' || e.key === 'Enter' || e.key === ' ') && !wrap.classList.contains('open')) {
                    e.preventDefault();
                    openDropdown();
                }
            });

            new MutationObserver(syncTrigger).observe(select, { attributes: true, attributeFilter: ['class', 'disabled'] });

            select.style.display = 'none';
            select.setAttribute('aria-hidden', 'true');
            select.tabIndex = -1;

            wrap.appendChild(select);
            wrap.appendChild(trigger);

            syncTrigger();

            return wrap;
        }
        // -----------------------------------------------------------------

        function updateSelectColor(selectElement, status) {
            selectElement.classList.remove('attendant', 'absent', 'oldbook','returnbook', 'no-select');
            if (status === 'ថ្មី' || status === '') {
                selectElement.classList.add('attendant');
            } else if (status === '0' ) {
                selectElement.classList.add('absent');
            } else if (status === 'ចាស់' ) {
                selectElement.classList.add('oldbook');  
             } else if (status === '1' ) {
                selectElement.classList.add('returnbook');        
            } else {
                selectElement.classList.add('no-select');
            }
        }

        function setPanelEditingDisabled(disabled) {
            document.querySelectorAll('.custom-select-wrap.open').forEach(w => w._csClose());

            const controls = studentListContainer.querySelectorAll('input, select, .custom-select-wrap button');
            controls.forEach(control => {
                if (disabled) {
                    control.dataset.wasDisabled = control.disabled ? 'true' : 'false';
                    control.disabled = true;
                } else {
                    control.disabled = control.dataset.wasDisabled === 'true';
                    delete control.dataset.wasDisabled;
                }
            });
        }

        let autoSaveTimer;
        let isAutoSaveRequest = false;
        let autoSavePending = false;

        function scheduleAutoSave() {
            autoSavePending = true;
            clearTimeout(autoSaveTimer);
            autoSaveTimer = setTimeout(() => {
                if (!saveBtn.disabled && currentSelectedClass) {
                    autoSavePending = false;
                    isAutoSaveRequest = true;
                    saveBtn.click();
                }
            }, 800);
        }

        previewBtn.addEventListener('click', () => {
            if (!currentSelectedClass) return;
            const targetSheetName = getTargetSheetName(currentSelectedClass);
            triggerDownload('exportPdf', 'pdf', targetSheetName, 'preview', currentSelectedClass);
        });

        pdfBtn.addEventListener('click', () => {
            if (!currentSelectedClass) return;
            const targetSheetName = getTargetSheetName(currentSelectedClass);
            triggerDownload('exportPdf', 'pdf', targetSheetName, 'download', currentSelectedClass);
        });

        excelBtn.addEventListener('click', () => {
            if (!currentSelectedClass) return;
            const targetSheetName = getTargetSheetName(currentSelectedClass);
            triggerDownload('exportExcel', 'excel', targetSheetName, 'download', currentSelectedClass);
        });

    saveBtn.addEventListener('click', async () => {
        const autoSaveRequest = isAutoSaveRequest;
        isAutoSaveRequest = false;
        autoSavePending = false;
        clearTimeout(autoSaveTimer);
            const records = [];
            const classObj = attendanceData[currentSelectedClass] || {};
            const targetSheetName = getTargetSheetName(currentSelectedClass);

            for (const subject in classObj) {
                for (const studentId in classObj[subject]) {
                    const status = classObj[subject][studentId];
                    
                    // Allow both filled statuses and 'null' (cleared) statuses to be processed
                    if (status !== undefined) {
                        const studentObj = (studentData[currentSelectedClass] || []).find(s => s.id == studentId);
                        const sName = studentObj ? studentObj.name : "";
                        records.push({ 
                            studentId: Number(studentId), 
                            studentName: sName, 
                            subject: subject, 
                            // If status is null (cleared text), send an empty string to clear the Sheet
                            status: status === null ? "" : status 
                        });
                    }
                }
            }

            if (records.length === 0) {
                if (!autoSaveRequest) {
                    showPopup('Please select attendance status for at least one student.');
                }
                return;
            }

            saveBtn.disabled = true;
            saveBtn.innerHTML = 'Saving <i class="fa-solid fa-spinner fa-spin"></i>';

            try {
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        className: currentSelectedClass,
                        sheetName: targetSheetName,
                        targetSheet: targetSheetName,
                        records: records
                    }),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });

                const res = await response.json();

                if (res.success) {
                    if (!autoSaveRequest) {
                        showPopup(`Successfully saved ✔️ Thanks!`);
                    }
                    await loadDataFromAppsScript();
                   // panelOverlay.style.display = 'none';
                } else {
                    showPopup('Error saving data: ' + res.error);
                }
            } catch (err) {
                console.error(err);
                showPopup('Failed to save ✖️ Try again!');
            } finally {
                saveBtn.disabled = false;
               saveBtn.innerHTML = 'Save <i class="fa-solid fa-book"></i>';
               if (autoSavePending && currentSelectedClass) {
                   scheduleAutoSave();
               }
            }
        });

        closePanelBtn.addEventListener('click', () => {
            panelOverlay.style.display = 'none';
            siteFooter.classList.remove('hidden');
        });
        panelOverlay.addEventListener('click', (e) => {
            if (e.target === panelOverlay) {
                panelOverlay.style.display = 'none';
                siteFooter.classList.remove('hidden');
            }
        });

        loadDataFromAppsScript();
    </script>
</body>
